name: Deploy Dashboard to GitHub Pages

# Esto indica que la acción se ejecutará cada vez que haya código nuevo en main
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Instalar Pandoc (necesario para compilar Rmd)
        uses: r-lib/actions/setup-pandoc@v2

      - name: Instalar dependencias espaciales de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Instalar librerías de R
        run: |
          install.packages(c("rmarkdown", "flexdashboard", "leaflet", "tidyverse",
          "plotly", "dlookr", "lubridate", "knitr", "sf", "factoextra", "randtests",
          "spdep", "scales", "geosphere", "patchwork", "Kendall"))
        shell: Rscript {0}

      - name: Compilar el dashboard a HTML
        run: |
          rmarkdown::render("flexdashboard_analisis_sismos.Rmd", output_file = "index.html")
        shell: Rscript {0}

      - name: Desplegar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages